# Fixes browsers that fail on "localhost" or when the server only binds to one address.
# See: https://docs.streamlit.io/library/advanced-features/configuration

[server]
# Local dev binds 127.0.0.1; on Streamlit Cloud the platform sets address/port itself.
headless = true
maxUploadSize = 1024
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
